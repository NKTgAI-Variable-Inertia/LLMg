name: Run Qwen AI API

on:
  repository_dispatch:
    types: [run_qwen_task]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt cho AI'
        required: true
        default: 'Xin chao'

jobs:
  run-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # bản CPU-only của torch, nhẹ hơn nhiều so với bản mặc định (đỡ vài phút cài đặt)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate requests

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-qwen2.5-0.5b-instruct

      - name: Run Qwen 2.5 0.5B script
        env:
          WEBHOOK_URL: ${{ secrets.RESULT_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          WORKFLOW_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          python run_ai.py
